[package]
name = "img_ops"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
img_blur = { path = "../img_blur" }
# `#[derive(TS)]` on `FilterInstance` and param structs is compiled in the lib target (wasm-pack);
# dev-dependencies alone are not enough.
ts-rs = { version = "10", features = ["serde-compat"] }
