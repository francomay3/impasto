[package]
name = "img_index"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
palette = "0.7"
img_blur = { path = "../img_blur" }
# `#[derive(TS)]` on `IndexedPaletteLab` is compiled in the lib target (wasm-pack); dev-deps alone are not enough.
ts-rs = { version = "10", features = ["serde-compat"] }
