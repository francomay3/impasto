# Options for `bun run loc` (cloc). One switch per line; # starts a comment.
# https://github.com/AlDanial/cloc#options

# Use `git ls-files` so only tracked files are counted and .gitignore rules apply
# (node_modules, dist, target/, crates/*/target/, src/wasm/, reports, etc.).
# Note: uncommitted new files are not included until they are tracked.
--vcs=git
